<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>DNS Control Hub</title><link rel="stylesheet" href="/assets/ui.css"><link rel="stylesheet" href="/app.css"></head><body>

<button class="nav-button active" data-view="overview"><svg><use href="/assets/icons.svg#icon-home"></use></svg><span>Overview</span></button><button class="nav-button" data-view="devices"><svg><use href="/assets/icons.svg#icon-shield"></use></svg><span>Devices</span></button><button class="nav-button" data-view="profiles"><svg><use href="/assets/icons.svg#icon-rules"></use></svg><span>Profiles</span></button><button class="nav-button" data-view="sites"><svg><use href="/assets/icons.svg#icon-search"></use></svg><span>Site rules</span></button><button class="nav-button" data-view="settings"><svg><use href="/assets/icons.svg#icon-check"></use></svg><span>Settings</span></button></nav><div class="sidebar-footer"><button class="button secondary theme-button">Theme</button><button class="button secondary" data-action="logout">Sign out</button></div></aside>
<main class="main-area"><header class="topbar"><p id="page-label" class="page-label">Overview</p><div class="top-actions"><button class="icon-button theme-button" aria-label="Change theme"><svg><use href="/assets/icons.svg#icon-moon"></use></svg></button><button class="button secondary compact" data-action="logout">Sign out</button></div></header><section class="page"><p id="controller-warning" class="status warning" hidden>Manage profiles on the first DNS VPS.</p><div id="content"></div></section></main>
<nav class="mobile-nav" aria-label="Mobile navigation"><button class="active" data-view="overview"><svg><use href="/assets/icons.svg#icon-home"></use></svg><span>Home</span></button><button data-view="devices"><svg><use href="/assets/icons.svg#icon-shield"></use></svg><span>Devices</span></button><button data-view="profiles"><svg><use href="/assets/icons.svg#icon-rules"></use></svg><span>Profiles</span></button><button data-view="sites"><svg><use href="/assets/icons.svg#icon-search"></use></svg><span>Sites</span></button><button data-view="settings"><svg><use href="/assets/icons.svg#icon-check"></use></svg><span>Settings</span></button></nav></div>
